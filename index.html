<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Test Pro Suite</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #ef4444; 
            --success: #10b981; 
            --dark: #1e293b; 
            --light-bg: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; background: var(--light-bg); background-attachment: fixed;
            color: var(--dark); min-height: 100vh;
        }

        .view { display: none; padding: 20px; max-width: 500px; margin: auto; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px; box-shadow: var(--card-shadow); 
            margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.5);
        }

        button { 
            padding: 16px; font-weight: 600; border: none; border-radius: 12px; 
            color: white; cursor: pointer; margin: 8px 0; width: 100%; font-size: 1rem; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        
        .btn-main { background: var(--primary); }
        .btn-alt { background: var(--dark); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-back { background: transparent; color: var(--dark); border: 1px solid #cbd5e1; margin-bottom: 15px; }

        input, textarea, select { 
            width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #e2e8f0; 
            border-radius: 12px; font-size: 16px; background: white;
        }

        /* Radio & Checkbox Single Row Alignment */
        .choice-row {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Aligns content to the left */
            gap: 12px;
            padding: 12px;
            background: white;
            border-radius: 10px;
            margin: 8px 0;
            border: 1px solid #eee;
            cursor: pointer;
        }

        .choice-row input[type="radio"], 
        .choice-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0; /* Removes default margins for perfect alignment */
            flex-shrink: 0; /* Prevents button from squishing on small screens */
        }

        .choice-label {
            font-size: 1rem;
            color: var(--dark);
        }

        /* Sticky Footer */
        .sticky-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05); padding: 15px 20px 30px;
            box-sizing: border-box; z-index: 1000; border-top: 1px solid #eee;
        }
        .footer-spacer { height: 180px; }

        #timer-display { 
            background: var(--dark); color: white; padding: 10px 20px; 
            border-radius: 30px; font-family: monospace; font-size: 1.4rem; 
            margin: 10px auto; width: fit-content; text-align: center;
        }

        .blink { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<!-- HOME VIEW -->
<div id="view-main" class="view active">
    <h1 style="text-align:center;">Corridor Test Suite</h1>
    <div class="card">
        <button class="btn-main" onclick="showView('view-projects-start')">Start Corridor Test</button>
        <button class="btn-alt" onclick="showView('view-settings')">List Of Project</button>
        <button class="btn-success" onclick="showView('view-reports')">Record</button>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button style="background: #64748b;" onclick="showView('view-logs')">Log</button>
        <button style="background: #94a3b8;" onclick="showView('view-summary')">Summary</button>
    </div>
</div>

<!-- START LIST VIEW -->
<div id="view-projects-start" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Choose Project</h2>
    <div id="start-project-list"></div>
</div>

<!-- INTERVIEW VIEW -->
<div id="view-interview" class="view" style="padding-bottom: 0;">
    <h3 id="active-p-name" style="text-align:center;"></h3>
    <div id="timer-display">00:00:00</div>
    <div id="recordStatus" style="text-align:center; font-weight:bold; font-size:0.8rem; margin-bottom:10px;">Ready</div>
    
    <div id="interview-questions"></div>
    <div class="footer-spacer"></div>

    <div class="sticky-controls">
        <div style="display:flex; gap:10px;">
            <button id="btnRecStart" class="btn-danger" onclick="startAudio()">⏺ Start Now</button>
            <button id="btnRecStop" class="btn-alt" onclick="stopAudio()" disabled>⏹ Stop</button>
        </div>
        <button class="btn-success" onclick="finishInterview()">💾 Save & Download Session</button>
    </div>
</div>

<!-- REMAINING VIEWS (Settings, Editor, etc.) -->
<!-- ... [Previous Logic for Settings, Records, Logs, Summary remains here] ... -->

<script>
    // State Management
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let logs = JSON.parse(localStorage.getItem('ct_logs')) || [];
    let currentEditProjIdx = -1;
    let tempProject = { name: '', questions: [] };
    let startTime, timerInterval, elapsedSeconds = 0;
    let mediaRecorder, audioChunks = [], activeProjectQuestions = [];

    // Core Function to show views
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-projects-start') renderStartList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-logs') renderLogs();
        if(id === 'view-summary') renderSummary();
        if(id !== 'view-interview') resetTimer();
        window.scrollTo(0,0);
    }

    function addLog(msg) {
        logs.unshift(`[${new Date().toLocaleString()}] ${msg}`);
        localStorage.setItem('ct_logs', JSON.stringify(logs.slice(0, 50)));
    }

    // Timer Logic
    function formatTime(s) { return new Date(s * 1000).toISOString().substr(11, 8); }
    function startTimer() { 
        startTime = Date.now() - (elapsedSeconds * 1000); 
        timerInterval = setInterval(() => { 
            elapsedSeconds = Math.floor((Date.now() - startTime) / 1000); 
            document.getElementById('timer-display').innerText = formatTime(elapsedSeconds); 
        }, 1000); 
    }
    function stopTimer() { clearInterval(timerInterval); }
    function resetTimer() { stopTimer(); elapsedSeconds = 0; if(document.getElementById('timer-display')) document.getElementById('timer-display').innerText = "00:00:00"; }

    // Interview Logic Fix
    function renderStartList() {
        const list = document.getElementById('start-project-list');
        list.innerHTML = projects.length ? 
            projects.map((p, i) => `<button class="btn-main" onclick="runInterview(${i})">${p.name}</button>`).join('') :
            '<div class="card" style="text-align:center;">No projects found. Create one in Settings.</div>';
    }

    function runInterview(idx) {
        const active = projects[idx];
        activeProjectQuestions = active.questions; // THE FIX: Assign questions to active state
        document.getElementById('active-p-name').innerText = active.name;
        
        const container = document.getElementById('interview-questions');
        container.innerHTML = active.questions.map((q, i) => {
            let inputHTML = '';
            if(q.type === 'text') {
                inputHTML = `<textarea class="ans-in" data-idx="${i}" placeholder="Type notes here..."></textarea>`;
            } else {
                inputHTML = q.options.map(opt => `
                    <label class="choice-row">
                        <input type="${q.type}" name="q${i}" value="${opt}" class="ans-in" data-idx="${i}">
                        <span class="choice-label">${opt}</span>
                    </label>
                `).join('');
            }
            return `<div class="card"><strong>${i+1}. ${q.text}</strong><div style="margin-top:10px;">${inputHTML}</div></div>`;
        }).join('');
        
        showView('view-interview');
    }

    // Audio Capture
    async function startAudio() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();
            startTimer();
            document.getElementById('recordStatus').innerText = "● RECORDING SESSION";
            document.getElementById('recordStatus').classList.add('blink');
            document.getElementById('btnRecStart').disabled = true;
            document.getElementById('btnRecStop').disabled = false;
        } catch (e) { alert("Microphone access is required."); }
    }

    function stopAudio() {
        if(mediaRecorder) mediaRecorder.stop();
        stopTimer();
        document.getElementById('recordStatus').innerText = "Recording Stopped";
        document.getElementById('recordStatus').classList.remove('blink');
        document.getElementById('btnRecStart').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
    }

    // Save and Finish
    function finishInterview() {
        const activeName = document.getElementById('active-p-name').innerText;
        const dur = document.getElementById('timer-display').innerText;
        let reportText = `CORRIDOR TEST REPORT\nProject: ${activeName}\nDate: ${new Date().toLocaleString()}\nDuration: ${dur}\n\n`;

        activeProjectQuestions.forEach((q, i) => {
            reportText += `Question ${i+1}: ${q.text}\n`;
            if(q.type === 'text') {
                const val = document.querySelector(`textarea[data-idx="${i}"]`).value;
                reportText += `Answer: ${val || "[No notes]"}\n`;
            } else {
                const checked = Array.from(document.querySelectorAll(`input[data-idx="${i}"]:checked`)).map(e => e.value);
                reportText += `Answer: ${checked.join(', ') || "[No selection]"}\n`;
            }
            reportText += `--------------------------\n`;
        });

        reports.push({ name: activeName, date: new Date().toLocaleString(), content: reportText });
        localStorage.setItem('ct_reports', JSON.stringify(reports));
        addLog(`Interview Completed: ${activeName}`);

        // Trigger Downloads
        downloadFile(new Blob([reportText], {type:'text/plain'}), `Record_${activeName}.txt`);
        if(audioChunks.length > 0) {
            downloadFile(new Blob(audioChunks, {type:'audio/webm'}), `Audio_${activeName}.webm`);
        }
        
        // Show Thanks
        showView('view-thanks');
    }

    function downloadFile(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    // Helper functions for Settings & Management
    // (Include these to ensure the app is fully functional)
    function renderProjectList() { document.getElementById('project-list').innerHTML = projects.map((p, i) => `<div class="card item-row"><b>${p.name}</b><button class="btn-danger" style="width:auto; padding:8px 12px;" onclick="deleteProject(${i})">Delete</button></div>`).join('') || "No projects."; }
    function deleteProject(i) { if(confirm("Are you sure?")) { projects.splice(i,1); localStorage.setItem('ct_projects', JSON.stringify(projects)); renderProjectList(); } }
    function prepareNewProject() { tempProject = { name: '', questions: [] }; document.getElementById('proj-name').value = ''; document.getElementById('questions-preview').innerHTML = ''; showView('view-editor'); }
    function saveProject() { tempProject.name = document.getElementById('proj-name').value || "Unnamed"; projects.push(tempProject); localStorage.setItem('ct_projects', JSON.stringify(projects)); addLog(`New Project Created: ${tempProject.name}`); showView('view-settings'); }
    function toggleOptionsUI() { document.getElementById('options-setup').style.display = (document.getElementById('q-type').value !== 'text') ? 'block' : 'none'; }
    function addOptionInput() { const div = document.createElement('div'); div.innerHTML = `<input type="text" class="opt-val" placeholder="Enter option">`; document.getElementById('options-list').appendChild(div); }
    function addOrUpdateQuestion() {
        const text = document.getElementById('q-text').value; const type = document.getElementById('q-type').value; if(!text) return;
        let opts = []; if(type !== 'text') document.querySelectorAll('.opt-val').forEach(i => { if(i.value) opts.push(i.value) });
        tempProject.questions.push({text, type, options: opts});
        document.getElementById('questions-preview').innerHTML += `<div class="card" style="padding:10px;">${tempProject.questions.length}. ${text}</div>`;
        document.getElementById('q-text').value = ''; document.getElementById('options-list').innerHTML = '';
    }
    function renderReports() { document.getElementById('reports-list').innerHTML = reports.map((r, i) => `<div class="card item-row"><div><b>${r.name}</b><br><small>${r.date}</small></div><button onclick="downloadFile(new Blob([reports[${i}].content],{type:'text/plain'}),'Record_'+reports[${i}].name+'.txt')" class="btn-success" style="width:auto; padding:8px;">Get Report</button></div>`).join('') || "No records."; }
    function renderLogs() { document.getElementById('logs-list').innerHTML = logs.map(l => `<div class="card" style="font-size:0.8rem; padding:10px;">${l}</div>`).join('') || "No logs."; }
    function renderSummary() { document.getElementById('summary-content').innerHTML = `<div class="card"><strong>Stats Overview</strong><br>Total Projects: ${projects.length}<br>Total Records: ${reports.length}</div>`; }
</script>

<!-- THANK YOU VIEW -->
<div id="view-thanks" class="view">
    <div class="card" style="text-align:center; padding:60px 20px;">
        <div style="font-size: 3rem; color: var(--success);">✔</div>
        <h2>Session Saved</h2>
        <p>Your notes and audio have been downloaded to your device.</p>
        <button class="btn-main" onclick="showView('view-main')">Return Home</button>
    </div>
</div>

</body>
</html>
