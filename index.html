<!-- VIEW: PROJECT EDITOR -->
<div id="view-editor" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Cancel</button>
    <h2 id="editor-head">Project Editor</h2>
    
    <div class="card">
        <label>Project Name</label>
        <input type="text" id="proj-name" placeholder="e.g., Mobile Onboarding Test">
    </div>

    <div class="card" style="border: 2px solid var(--primary);">
        <h4 id="q-editor-mode" style="margin:0; color:var(--primary);">Add/Edit Question</h4>
        <input type="text" id="q-text" placeholder="Question Text">
        <select id="q-type" onchange="toggleOptionsUI()">
            <option value="text">Plain Text</option>
            <option value="radio">Radio Button</option>
            <option value="checkbox">Checkbox</option>
        </select>
        <div id="options-setup" style="display:none; margin-top:10px;">
            <div id="options-list"></div>
            <button class="btn-alt" style="padding:8px; font-size:0.8rem; width:auto;" onclick="addOptionInput()">+ Add Option</button>
        </div>
        <button id="add-q-btn" class="btn-main" onclick="addOrUpdateQuestion()" style="margin-top:15px;">Save Question to List</button>
    </div>

    <div id="questions-preview"></div>
    <button class="btn-success" onclick="saveProject()" style="margin-top:20px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);">Finalize & Save Project</button>
</div>

<script>
    // --- State Persistence ---
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let logs = JSON.parse(localStorage.getItem('ct_logs')) || [];
    
    let currentEditProjIdx = -1;
    let currentEditQuesIdx = -1; // Track which question we are editing
    let tempProject = { name: '', questions: [] };
    
    let startTime, timerInterval, elapsedSeconds = 0;
    let mediaRecorder, audioChunks = [], activeProjectQuestions = [];

    // --- Core Navigation ---
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-projects-start') renderStartList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-logs') renderLogs();
        if(id === 'view-summary') renderSummary();
        
        window.scrollTo(0,0);
    }

    // --- Question Management Logic ---
    function addOrUpdateQuestion() {
        const text = document.getElementById('q-text').value;
        const type = document.getElementById('q-type').value;
        if(!text) return alert("Please enter question text.");

        let options = [];
        if(type !== 'text') {
            document.querySelectorAll('.opt-val').forEach(i => { if(i.value) options.push(i.value) });
        }

        const questionData = {
            text: text,
            type: type,
            options: options,
            disabled: false // Default to enabled
        };

        if (currentEditQuesIdx > -1) {
            // Update existing
            questionData.disabled = tempProject.questions[currentEditQuesIdx].disabled;
            tempProject.questions[currentEditQuesIdx] = questionData;
            currentEditQuesIdx = -1;
            document.getElementById('add-q-btn').innerText = "Add Question to Project";
        } else {
            // Add new
            tempProject.questions.push(questionData);
        }

        document.getElementById('q-text').value = '';
        document.getElementById('options-list').innerHTML = '';
        renderEditorPreview();
    }

    function renderEditorPreview() {
        const cont = document.getElementById('questions-preview');
        cont.innerHTML = '<h4 style="margin-top:20px;">Project Sequence</h4>';
        
        tempProject.questions.forEach((q, i) => {
            const opacity = q.disabled ? '0.5' : '1';
            const disableLabel = q.disabled ? 'Enable' : 'Disable';
            
            cont.innerHTML += `
                <div class="card" style="opacity: ${opacity}; border-left: 5px solid ${q.disabled ? '#ccc' : 'var(--primary)'}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span style="font-weight:bold;">${i+1}. ${q.text} <small>(${q.type})</small></span>
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;">
                        <button class="btn-main" style="padding:5px 10px; width:auto; font-size:0.7rem;" onclick="loadQuestionForEdit(${i})">Edit</button>
                        <button class="btn-alt" style="padding:5px 10px; width:auto; font-size:0.7rem;" onclick="moveQuestion(${i}, -1)">↑ Up</button>
                        <button class="btn-alt" style="padding:5px 10px; width:auto; font-size:0.7rem;" onclick="moveQuestion(${i}, 1)">↓ Down</button>
                        <button style="padding:5px 10px; width:auto; font-size:0.7rem; background:#64748b;" onclick="toggleQuestionStatus(${i})">${disableLabel}</button>
                        <button class="btn-danger" style="padding:5px 10px; width:auto; font-size:0.7rem;" onclick="deleteQuestionFromDraft(${i})">Del</button>
                    </div>
                </div>`;
        });
    }

    function loadQuestionForEdit(i) {
        currentEditQuesIdx = i;
        const q = tempProject.questions[i];
        document.getElementById('q-text').value = q.text;
        document.getElementById('q-type').value = q.type;
        toggleOptionsUI();
        
        const optList = document.getElementById('options-list');
        optList.innerHTML = '';
        if(q.options) {
            q.options.forEach(opt => addOptionInput(opt));
        }
        document.getElementById('add-q-btn').innerText = "Update Question #" + (i+1);
        window.scrollTo(0, 100);
    }

    function moveQuestion(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= tempProject.questions.length) return;
        
        // Swap elements
        const temp = tempProject.questions[index];
        tempProject.questions[index] = tempProject.questions[newIndex];
        tempProject.questions[newIndex] = temp;
        
        renderEditorPreview();
    }

    function toggleQuestionStatus(i) {
        tempProject.questions[i].disabled = !tempProject.questions[i].disabled;
        renderEditorPreview();
    }

    function deleteQuestionFromDraft(i) {
        if(confirm("Delete this question from project?")) {
            tempProject.questions.splice(i, 1);
            renderEditorPreview();
        }
    }

    // --- Interview Execution Fix (Skipping Disabled Questions) ---
    function runInterview(idx) {
        const active = projects[idx];
        // Filter out disabled questions for the actual test
        activeProjectQuestions = active.questions.filter(q => !q.disabled);
        
        if(activeProjectQuestions.length === 0) {
            alert("This project has no enabled questions.");
            return;
        }

        document.getElementById('active-p-name').innerText = active.name;
        const container = document.getElementById('interview-questions');
        container.innerHTML = activeProjectQuestions.map((q, i) => {
            let input = `<textarea class="ans-in" data-idx="${i}" placeholder="Notes..."></textarea>`;
            if(q.type !== 'text') {
                input = q.options.map(opt => `
                    <label class="choice-row">
                        <input type="${q.type}" name="q${i}" value="${opt}" class="ans-in" data-idx="${i}">
                        <span>${opt}</span>
                    </label>`).join('');
            }
            return `<div class="card"><b>${i+1}. ${q.text}</b><div style="margin-top:10px;">${input}</div></div>`;
        }).join('');
        
        showView('view-interview');
    }

    // --- Implementation Helpers ---
    function saveProject() {
        const name = document.getElementById('proj-name').value || "Unnamed Project";
        tempProject.name = name;
        
        if (currentEditProjIdx > -1) {
            projects[currentEditProjIdx] = tempProject;
            addLog(`Updated project: ${name}`);
        } else {
            projects.push(tempProject);
            addLog(`Created project: ${name}`);
        }
        
        localStorage.setItem('ct_projects', JSON.stringify(projects));
        showView('view-settings');
    }

    function addOptionInput(val = '') {
        const div = document.createElement('div');
        div.innerHTML = `<input type="text" class="opt-val" value="${val}" placeholder="Option Value">`;
        document.getElementById('options-list').appendChild(div);
    }
    
    // Ensure existing startAudio, stopAudio, and render functions are maintained.
</script>
