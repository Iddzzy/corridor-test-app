<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Test Ultimate</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --success: #2ecc71; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: sans-serif; margin: 0; background: var(--light); color: var(--dark); padding-bottom: 30px; }
        .view { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .active { display: block; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1, h2, h3 { text-align: center; }
        button { padding: 15px; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; margin: 5px 0; width: 100%; font-size: 1rem; }
        .btn-main { background: var(--primary); }
        .btn-alt { background: var(--dark); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-back { background: #95a5a6; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 5px; }
        .log-item { font-size: 0.85rem; padding: 8px; border-bottom: 1px solid #ddd; }
        .blink { animation: blinker 1s linear infinite; color: var(--danger); }
        @keyframes blinker { 50% { opacity: 0; } }
        .btn-group { display: flex; gap: 5px; }
        .btn-small { padding: 8px; font-size: 0.8rem; width: auto; }
    </style>
</head>
<body>

<div id="view-main" class="view active">
    <h1>Welcome To Corridor Test</h1>
    <button class="btn-main" onclick="showView('view-projects-start')">Start Corridor Test</button>
    <button class="btn-alt" onclick="showView('view-settings')">Settings</button>
    <button class="btn-success" onclick="showView('view-reports')">Records</button>
    <button style="background: #607d8b;" onclick="showView('view-logs')">Action Logs</button>
</div>

<div id="view-settings" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Projects</h2>
    <div id="project-list"></div>
    <button class="btn-success" onclick="prepareNewProject()">+ Add New Project</button>
</div>

<div id="view-editor" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Cancel</button>
    <h2 id="editor-head">New Project</h2>
    <input type="text" id="proj-name" placeholder="Project Name">
    <div class="card">
        <h4>Add Question</h4>
        <input type="text" id="q-text" placeholder="Question Text">
        <select id="q-type" onchange="toggleOptionsUI()">
            <option value="text">Plain Text</option>
            <option value="radio">Radio Button</option>
            <option value="checkbox">Checkbox</option>
        </select>
        <div id="options-setup" style="display:none;">
            <div id="options-list"></div>
            <button class="btn-alt btn-small" onclick="addOptionInput()">+ Add Option</button>
        </div>
        <button class="btn-main" onclick="addQuestionToProject()">Add Question</button>
    </div>
    <div id="questions-preview"></div>
    <button class="btn-success" onclick="saveProject()">Save Project Changes</button>
</div>

<div id="view-project-detail" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Back</button>
    <h2 id="view-p-title"></h2>
    <div id="view-p-content"></div>
    <button class="btn-main" id="edit-proj-btn">Edit Project Structure</button>
</div>

<div id="view-projects-start" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Select Project</h2>
    <div id="start-project-list"></div>
</div>

<div id="view-interview" class="view">
    <h3 id="active-p-name"></h3>
    <div id="recordStatus">Ready</div>
    <div id="interview-questions"></div>
    <div style="display:flex; gap:10px;">
        <button id="btnRecStart" class="btn-danger" onclick="startAudio()">⏺ Record</button>
        <button id="btnRecStop" class="btn-alt" onclick="stopAudio()" disabled>⏹ Stop</button>
    </div>
    <button class="btn-success" onclick="finishInterview()">💾 Save & Download</button>
</div>

<div id="view-reports" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Saved Records</h2>
    <div id="reports-list"></div>
</div>

<div id="view-logs" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Action Logs</h2>
    <div id="logs-list" class="card"></div>
    <button class="btn-danger btn-small" onclick="clearLogs()">Clear Logs</button>
</div>

<script>
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let logs = JSON.parse(localStorage.getItem('ct_logs')) || [];
    let currentEditIdx = -1;
    let tempProject = { name: '', questions: [] };
    let activeProject = null;
    let mediaRecorder;
    let audioChunks = [];

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-projects-start') renderStartList();
        if(id === 'view-logs') renderLogs();
    }

    function addLog(msg) {
        const entry = `[${new Date().toLocaleString()}] ${msg}`;
        logs.unshift(entry);
        localStorage.setItem('ct_logs', JSON.stringify(logs));
    }

    // PROJECT EDITOR
    function prepareNewProject() {
        currentEditIdx = -1;
        tempProject = { name: '', questions: [], date: new Date().toLocaleDateString() };
        document.getElementById('editor-head').innerText = "New Project";
        document.getElementById('proj-name').value = '';
        renderEditorPreview();
        showView('view-editor');
    }

    function toggleOptionsUI() {
        const type = document.getElementById('q-type').value;
        document.getElementById('options-setup').style.display = (type !== 'text') ? 'block' : 'none';
        if(type !== 'text') {
            document.getElementById('options-list').innerHTML = '';
            addOptionInput(); addOptionInput();
        }
    }

    function addOptionInput() {
        const div = document.createElement('div');
        div.innerHTML = `<input type="text" class="opt-val" placeholder="Option">`;
        document.getElementById('options-list').appendChild(div);
    }

    function addQuestionToProject() {
        const text = document.getElementById('q-text').value;
        const type = document.getElementById('q-type').value;
        if(!text) return alert("Enter question text");
        let options = [];
        if(type !== 'text') {
            document.querySelectorAll('.opt-val').forEach(i => { if(i.value) options.push(i.value) });
        }
        tempProject.questions.push({ text, type, options });
        renderEditorPreview();
        document.getElementById('q-text').value = '';
    }

    function renderEditorPreview() {
        const cont = document.getElementById('questions-preview');
        cont.innerHTML = '<h4>Questions in Project:</h4>';
        tempProject.questions.forEach((q, i) => {
            cont.innerHTML += `<div class="card item-row">
                <span>${i+1}. ${q.text}</span>
                <button onclick="removeQuestion(${i})" class="btn-danger btn-small">Delete</button>
            </div>`;
        });
    }

    function removeQuestion(i) {
        if(confirm("Are you sure you want to delete this question?\n\nYes - Proceed\nCancel - Go back")) {
            tempProject.questions.splice(i,1);
            renderEditorPreview();
        }
    }

    function saveProject() {
        tempProject.name = document.getElementById('proj-name').value || "Unnamed";
        if(currentEditIdx > -1) {
            projects[currentEditIdx] = tempProject;
            addLog(`Edited project: ${tempProject.name}`);
        } else {
            projects.push(tempProject);
            addLog(`Created project: ${tempProject.name}`);
        }
        localStorage.setItem('ct_projects', JSON.stringify(projects));
        showView('view-settings');
    }

    // SETTINGS / VIEW / DUPLICATE
    function renderProjectList() {
        const list = document.getElementById('project-list');
        list.innerHTML = projects.map((p, i) => `
            <div class="card">
                <b>${p.name}</b><br><small>Created: ${p.date}</small>
                <div class="btn-group">
                    <button class="btn-main btn-small" onclick="viewProjectDetail(${i})">View</button>
                    <button class="btn-alt btn-small" onclick="duplicateProject(${i})">Duplicate</button>
                    <button class="btn-danger btn-small" onclick="deleteProject(${i})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function viewProjectDetail(i) {
        const p = projects[i];
        document.getElementById('view-p-title').innerText = p.name;
        document.getElementById('view-p-content').innerHTML = p.questions.map((q, idx) => `
            <div class="card"><b>${idx+1}. ${q.text}</b><br><small>Type: ${q.type}</small></div>
        `).join('');
        document.getElementById('edit-proj-btn').onclick = () => {
            currentEditIdx = i;
            tempProject = JSON.parse(JSON.stringify(p)); // Deep copy
            document.getElementById('proj-name').value = tempProject.name;
            document.getElementById('editor-head').innerText = "Edit Project";
            renderEditorPreview();
            showView('view-editor');
        };
        showView('view-project-detail');
    }

    function duplicateProject(i) {
        let original = projects[i];
        let copy = JSON.parse(JSON.stringify(original));
        
        // Find correct number for name
        let count = 1;
        let newName = `${original.name} (${count})`;
        while(projects.some(p => p.name === newName)) {
            count++;
            newName = `${original.name} (${count})`;
        }
        
        copy.name = newName;
        projects.push(copy);
        localStorage.setItem('ct_projects', JSON.stringify(projects));
        addLog(`Duplicated project: ${original.name} -> ${newName}`);
        renderProjectList();
    }

    function deleteProject(i) {
        if(confirm("Are you sure you want to delete this project?\n\nYes - Proceed\nCancel - Go back")) {
            addLog(`Deleted project: ${projects[i].name}`);
            projects.splice(i,1);
            localStorage.setItem('ct_projects', JSON.stringify(projects));
            renderProjectList();
        }
    }

    // LOGS
    function renderLogs() {
        document.getElementById('logs-list').innerHTML = logs.map(l => `<div class="log-item">${l}</div>`).join('') || "No logs yet.";
    }
    function clearLogs() { if(confirm("Clear all action logs?")) { logs = []; localStorage.removeItem('ct_logs'); renderLogs(); } }

    // INTERVIEW (REMAINS SIMILAR BUT ADDS LOGGING)
    function renderStartList() {
        document.getElementById('start-project-list').innerHTML = projects.map((p, i) => `
            <button class="btn-main" onclick="runInterview(${i})">${p.name}</button>
        `).join('');
    }

    function runInterview(idx) {
        activeProject = projects[idx];
        document.getElementById('active-p-name').innerText = activeProject.name;
        const cont = document.getElementById('interview-questions');
        cont.innerHTML = activeProject.questions.map((q, i) => {
            let input = `<textarea class="ans-in" data-idx="${i}"></textarea>`;
            if(q.type !== 'text') {
                input = q.options.map(opt => `
                    <label class="item-row card" style="justify-content:flex-start;">
                        <input type="${q.type}" name="q${i}" value="${opt}" class="ans-in" data-idx="${i}"> ${opt}
                    </label>
                `).join('');
            }
            return `<div class="card"><b>${i+1}. ${q.text}</b><br>${input}</div>`;
        }).join('');
        showView('view-interview');
    }

    async function startAudio() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();
        document.getElementById('recordStatus').innerText = "● RECORDING...";
        document.getElementById('recordStatus').classList.add('blink');
        document.getElementById('btnRecStart').disabled = true;
        document.getElementById('btnRecStop').disabled = false;
    }

    function stopAudio() {
        mediaRecorder.stop();
        document.getElementById('recordStatus').innerText = "Audio Saved";
        document.getElementById('recordStatus').classList.remove('blink');
        document.getElementById('btnRecStart').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
    }

    function finishInterview() {
        let txt = `PROJECT: ${activeProject.name}\nDATE: ${new Date().toLocaleString()}\n\n`;
        activeProject.questions.forEach((q, i) => {
            txt += `Q${i+1}: ${q.text}\n`;
            if(q.type === 'text') {
                txt += `A: ${document.querySelector(`textarea[data-idx="${i}"]`).value}\n`;
            } else {
                const sel = Array.from(document.querySelectorAll(`input[data-idx="${i}"]:checked`)).map(el => el.value);
                txt += `A: ${sel.join(', ') || 'No answer'}\n`;
            }
            txt += `-------------------\n`;
        });

        reports.push({ name: activeProject.name, date: new Date().toLocaleString(), content: txt });
        localStorage.setItem('ct_reports', JSON.stringify(reports));
        addLog(`Completed interview for: ${activeProject.name}`);

        const blob = new Blob([txt], { type: 'text/plain' });
        downloadFile(blob, `Record_${activeProject.name}.txt`);
        showView('view-main');
    }

    function renderReports() {
        document.getElementById('reports-list').innerHTML = reports.map((r, i) => `
            <div class="card item-row">
                <div><b>${r.name}</b><br><small>${r.date}</small></div>
                <div class="btn-group">
                    <button onclick="downloadReport(${i})" class="btn-success btn-small">Download</button>
                    <button onclick="deleteRecord(${i})" class="btn-danger btn-small">X</button>
                </div>
            </div>
        `).join('') || "No records.";
    }

    function downloadReport(i) {
        const r = reports[i];
        downloadFile(new Blob([r.content], {type:'text/plain'}), `Re-Download_${r.name}.txt`);
    }

    function deleteRecord(i) {
        if(confirm("Are you sure you want to delete this record?\n\nYes - Proceed\nCancel - Go back")) {
            addLog(`Deleted record: ${reports[i].name}`);
            reports.splice(i,1);
            localStorage.setItem('ct_reports', JSON.stringify(reports));
            renderReports();
        }
    }

    function downloadFile(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
    }
</script>
</body>
</html>
