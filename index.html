<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Test Pro Max</title>
    <style>
        :root { --primary: #3498db; --danger: #e74c3c; --success: #2ecc71; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: sans-serif; margin: 0; background: var(--light); color: var(--dark); padding-bottom: 50px; }
        .view { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .active { display: block; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1, h2, h3 { text-align: center; margin-top: 10px; }
        button { padding: 15px; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; margin: 5px 0; width: 100%; font-size: 1rem; }
        .btn-main { background: var(--primary); }
        .btn-alt { background: var(--dark); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-back { background: #95a5a6; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .opt-box { border: 1px dashed #ccc; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .blink { animation: blinker 1s linear infinite; color: var(--danger); }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="view-main" class="view active">
    <h1>Welcome To Corridor Test</h1>
    <button class="btn-main" onclick="showView('view-projects-start')">Start Corridor Test</button>
    <button class="btn-alt" onclick="showView('view-settings')">Settings</button>
    <button class="btn-success" onclick="showView('view-reports')">Reports</button>
</div>

<div id="view-settings" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Projects</h2>
    <div id="project-list" class="card"></div>
    <button class="btn-success" onclick="prepareNewProject()">+ Add New Project</button>
</div>

<div id="view-editor" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Cancel</button>
    <input type="text" id="proj-name" placeholder="Project Name">
    <div class="card">
        <h4>Add Question</h4>
        <input type="text" id="q-text" placeholder="Question Text">
        <select id="q-type" onchange="toggleOptionsUI()">
            <option value="text">Plain Text</option>
            <option value="radio">Radio Button (Single)</option>
            <option value="checkbox">Checkbox (Multiple)</option>
        </select>
        <div id="options-setup" style="display:none;" class="opt-box">
            <div id="options-list"></div>
            <button type="button" class="btn-alt" style="width:auto; padding:5px 10px;" onclick="addOptionInput()">+ Add Option</button>
        </div>
        <button class="btn-main" onclick="addQuestionToProject()">Add Question to List</button>
    </div>
    <div id="questions-preview"></div>
    <button class="btn-success" onclick="saveProject()">Save Full Project</button>
</div>

<div id="view-project-detail" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Back</button>
    <h2 id="view-p-title"></h2>
    <div id="view-p-content"></div>
</div>

<div id="view-projects-start" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Select Project to Start</h2>
    <div id="start-project-list"></div>
</div>

<div id="view-interview" class="view">
    <h3 id="active-p-name"></h3>
    <div id="recordStatus" style="text-align:center; font-weight:bold;">Ready</div>
    <div id="interview-questions"></div>
    <div style="display:flex; gap:10px;">
        <button id="btnRecStart" class="btn-danger" onclick="startAudio()">⏺ Record</button>
        <button id="btnRecStop" class="btn-alt" onclick="stopAudio()" disabled>⏹ Stop</button>
    </div>
    <button class="btn-success" onclick="finishInterview()">💾 Save & Download Session</button>
</div>

<div id="view-reports" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back</button>
    <h2>Saved Reports</h2>
    <div id="reports-list"></div>
</div>

<script>
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let tempProject = { name: '', questions: [] };
    let activeProject = null;
    let mediaRecorder;
    let audioChunks = [];

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-projects-start') renderStartList();
    }

    // PROJECT EDITOR LOGIC
    function prepareNewProject() {
        tempProject = { name: '', questions: [], date: new Date().toLocaleDateString() };
        document.getElementById('proj-name').value = '';
        document.getElementById('questions-preview').innerHTML = '';
        showView('view-editor');
    }

    function toggleOptionsUI() {
        const type = document.getElementById('q-type').value;
        const box = document.getElementById('options-setup');
        box.style.display = (type !== 'text') ? 'block' : 'none';
        if(type !== 'text') {
            document.getElementById('options-list').innerHTML = '';
            addOptionInput(); addOptionInput(); // Default 2 options
        }
    }

    function addOptionInput() {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<input type="text" class="opt-val" placeholder="Option Text">`;
        document.getElementById('options-list').appendChild(div);
    }

    function addQuestionToProject() {
        const text = document.getElementById('q-text').value;
        const type = document.getElementById('q-type').value;
        let options = [];
        if(type !== 'text') {
            document.querySelectorAll('.opt-val').forEach(i => { if(i.value) options.push(i.value) });
        }
        tempProject.questions.push({ text, type, options });
        renderEditorPreview();
        document.getElementById('q-text').value = '';
    }

    function renderEditorPreview() {
        const cont = document.getElementById('questions-preview');
        cont.innerHTML = '<h4>Questions:</h4>';
        tempProject.questions.forEach((q, i) => {
            cont.innerHTML += `<div class="card"><b>${i+1}. ${q.text}</b> <button onclick="tempProject.questions.splice(${i},1);renderEditorPreview();" style="background:red; width:auto; padding:2px 5px;">X</button></div>`;
        });
    }

    function saveProject() {
        tempProject.name = document.getElementById('proj-name').value || "Unnamed";
        projects.push(tempProject);
        localStorage.setItem('ct_projects', JSON.stringify(projects));
        showView('view-settings');
    }

    // SETTINGS VIEWING
    function renderProjectList() {
        const list = document.getElementById('project-list');
        list.innerHTML = projects.length ? '' : 'No projects created.';
        projects.forEach((p, idx) => {
            list.innerHTML += `
                <div class="item-row card">
                    <div><b>${p.name}</b><br><small>${p.date}</small></div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="viewProjectDetail(${idx})" class="btn-main" style="width:auto;">View</button>
                        <button onclick="deleteProject(${idx})" class="btn-danger" style="width:auto;">Delete</button>
                    </div>
                </div>`;
        });
    }

    function viewProjectDetail(idx) {
        const p = projects[idx];
        document.getElementById('view-p-title').innerText = p.name;
        let html = '';
        p.questions.forEach((q, i) => {
            html += `<div class="card"><b>${i+1}. ${q.text}</b><br><small>Type: ${q.type}</small></div>`;
        });
        document.getElementById('view-p-content').innerHTML = html;
        showView('view-project-detail');
    }

    function deleteProject(idx) { if(confirm("Delete?")) { projects.splice(idx,1); localStorage.setItem('ct_projects', JSON.stringify(projects)); renderProjectList(); } }

    // INTERVIEW LOGIC
    function renderStartList() {
        const list = document.getElementById('start-project-list');
        list.innerHTML = projects.map((p, i) => `<button class="btn-main" onclick="runInterview(${i})">${p.name}</button>`).join('');
    }

    function runInterview(idx) {
        activeProject = projects[idx];
        document.getElementById('active-p-name').innerText = activeProject.name;
        const cont = document.getElementById('interview-questions');
        cont.innerHTML = activeProject.questions.map((q, i) => {
            let input = `<textarea class="ans-in" data-idx="${i}"></textarea>`;
            if(q.type !== 'text') {
                input = q.options.map(opt => `
                    <label style="display:block; padding:10px; background:#fff; margin:5px 0; border-radius:8px; border:1px solid #ddd;">
                        <input type="${q.type}" name="q${i}" value="${opt}" class="ans-in" data-idx="${i}"> ${opt}
                    </label>
                `).join('');
            }
            return `<div class="card"><b>${i+1}. ${q.text}</b><br>${input}</div>`;
        }).join('');
        showView('view-interview');
    }

    // AUDIO
    async function startAudio() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.start();
        document.getElementById('recordStatus').innerText = "● RECORDING...";
        document.getElementById('recordStatus').classList.add('blink');
        document.getElementById('btnRecStart').disabled = true;
        document.getElementById('btnRecStop').disabled = false;
    }

    function stopAudio() {
        mediaRecorder.stop();
        document.getElementById('recordStatus').innerText = "Recording Cached";
        document.getElementById('recordStatus').classList.remove('blink');
        document.getElementById('btnRecStart').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
    }

    function finishInterview() {
        let txt = `PROJECT: ${activeProject.name}\nDATE: ${new Date().toLocaleString()}\n\n`;
        activeProject.questions.forEach((q, i) => {
            txt += `Q${i+1}: ${q.text}\n`;
            if(q.type === 'text') {
                txt += `A: ${document.querySelector(`textarea[data-idx="${i}"]`).value}\n`;
            } else {
                const sel = Array.from(document.querySelectorAll(`input[data-idx="${i}"]:checked`)).map(el => el.value);
                txt += `A: ${sel.join(', ') || 'No answer'}\n`;
            }
            txt += `-------------------\n`;
        });

        // Save to Reports list
        reports.push({ name: activeProject.name, date: new Date().toLocaleString(), content: txt });
        localStorage.setItem('ct_reports', JSON.stringify(reports));

        // Trigger Download
        const blob = new Blob([txt], { type: 'text/plain' });
        downloadFile(blob, `Report_${activeProject.name}.txt`);
        
        alert("Session saved to Reports and downloaded.");
        showView('view-main');
    }

    function renderReports() {
        const list = document.getElementById('reports-list');
        list.innerHTML = reports.length ? '' : 'No reports saved.';
        reports.forEach((r, idx) => {
            list.innerHTML += `
                <div class="item-row card">
                    <div><b>${r.name}</b><br><small>${r.date}</small></div>
                    <button onclick="downloadReport(${idx})" class="btn-success" style="width:auto;">Re-Download</button>
                    <button onclick="reports.splice(${idx},1);localStorage.setItem('ct_reports', JSON.stringify(reports));renderReports();" class="btn-danger" style="width:auto; margin-left:5px;">X</button>
                </div>`;
        });
    }

    function downloadReport(idx) {
        const r = reports[idx];
        const blob = new Blob([r.content], { type: 'text/plain' });
        downloadFile(blob, `Re-Download_${r.name}.txt`);
    }

    function downloadFile(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
    }
</script>
</body>
</html>
