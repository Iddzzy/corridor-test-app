<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Test Expert Pro</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #ef4444; 
            --success: #10b981; 
            --dark: #1e293b; 
            --light-bg: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            background: var(--light-bg); 
            background-attachment: fixed;
            color: var(--dark); 
            min-height: 100vh;
        }

        .view { display: none; padding: 24px; max-width: 500px; margin: auto; animation: fadeIn 0.3s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 1.8rem; font-weight: 800; color: var(--dark); text-align: center; margin-bottom: 30px; letter-spacing: -0.025em; }
        h2 { font-size: 1.4rem; font-weight: 700; color: var(--dark); margin-bottom: 20px; }

        /* Card Styling */
        .card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: var(--card-shadow); 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Interactive Elements */
        button { 
            padding: 16px; font-weight: 600; border: none; border-radius: 12px; 
            color: white; cursor: pointer; margin: 8px 0; width: 100%; font-size: 1rem; 
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-main { background: var(--primary); }
        .btn-alt { background: var(--dark); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-back { background: transparent; color: var(--dark); border: 1px solid #cbd5e1; margin-bottom: 20px; }

        input, textarea, select { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 1px solid #e2e8f0; border-radius: 12px; 
            box-sizing: border-box; font-size: 16px; background: white;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* Timer Display */
        #timer-display { 
            background: var(--dark); color: white; padding: 8px 16px; border-radius: 30px;
            font-family: 'Monaco', monospace; font-size: 1.2rem; margin: 10px auto; width: fit-content;
        }

        /* Sticky Footer */
        .sticky-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.05); padding: 15px 25px 30px;
            box-sizing: border-box; z-index: 1000; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .footer-spacer { height: 180px; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .blink { color: var(--danger); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="view-main" class="view active">
    <h1>Corridor Test<br><span style="color:var(--primary); font-size: 0.9rem; font-weight: 500;">DESIGN RESEARCH SUITE</span></h1>
    <div class="card">
        <button class="btn-main" onclick="showView('view-projects-start')">Start Corridor Test</button>
        <button class="btn-alt" onclick="showView('view-settings')">List Of Project</button>
        <button class="btn-success" onclick="showView('view-reports')">Record</button>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button style="background: #64748b;" onclick="showView('view-logs')">Log</button>
        <button style="background: #94a3b8;" onclick="showView('view-summary')">Summary</button>
    </div>
</div>

<div id="view-interview" class="view" style="padding-bottom: 0;">
    <button class="btn-back" onclick="showView('view-main')">← Abort Session</button>
    <h3 id="active-p-name" style="margin-bottom: 5px;"></h3>
    <div id="timer-display">00:00:00</div>
    <div id="recordStatus" style="text-align:center; font-size: 0.8rem; margin-bottom: 20px;">Ready to start</div>
    
    <div id="interview-questions"></div>
    <div class="footer-spacer"></div>

    <div class="sticky-controls">
        <div style="display:flex; gap:10px;">
            <button id="btnRecStart" class="btn-danger" onclick="startAudio()">⏺ Start Now</button>
            <button id="btnRecStop" class="btn-alt" onclick="stopAudio()" disabled>⏹ Stop</button>
        </div>
        <button class="btn-success" onclick="finishInterview()">💾 Save & Download Session</button>
    </div>
</div>

<script>
    /* ... [REMAINING JAVASCRIPT LOGIC FROM PREVIOUS VERSION] ... */
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let logs = JSON.parse(localStorage.getItem('ct_logs')) || [];
    let currentEditProjIdx = -1;
    let currentEditQuesIdx = -1;
    let tempProject = { name: '', questions: [] };
    let startTime;
    let timerInterval;
    let elapsedSeconds = 0;
    let mediaRecorder;
    let audioChunks = [];
    let activeProjectQuestions = [];

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-projects-start') renderStartList();
        if(id === 'view-logs') renderLogs();
        if(id === 'view-summary') renderSummary();
        if(id !== 'view-interview') resetTimer();
    }

    // Logic implementation continues exactly as before...
    // (Ensure you keep all the helper functions for adding questions, duplication, timer, etc.)
    
    /* ADD LOGIC FUNCTIONS HERE (Duplicate, Save, Timer, etc.) */

    function formatTime(s) { return new Date(s * 1000).toISOString().substr(11, 8); }
    function startTimer() { startTime = Date.now() - (elapsedSeconds * 1000); timerInterval = setInterval(() => { elapsedSeconds = Math.floor((Date.now() - startTime) / 1000); document.getElementById('timer-display').innerText = formatTime(elapsedSeconds); }, 1000); }
    function stopTimer() { clearInterval(timerInterval); }
    function resetTimer() { stopTimer(); elapsedSeconds = 0; if(document.getElementById('timer-display')) document.getElementById('timer-display').innerText = "00:00:00"; }

    async function startAudio() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();
            startTimer();
            document.getElementById('recordStatus').innerText = "● RECORDING SESSION";
            document.getElementById('recordStatus').classList.add('blink');
            document.getElementById('btnRecStart').disabled = true;
            document.getElementById('btnRecStop').disabled = false;
        } catch (err) { alert("Mic access denied."); }
    }

    function stopAudio() {
        if(mediaRecorder) mediaRecorder.stop();
        stopTimer();
        document.getElementById('recordStatus').innerText = "Recording Paused";
        document.getElementById('recordStatus').classList.remove('blink');
        document.getElementById('btnRecStart').disabled = false;
        document.getElementById('btnRecStop').disabled = true;
    }
    
    // ... rest of the helper functions from previous versions to ensure full project management ...
</script>
</body>
</html>
